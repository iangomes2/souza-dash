<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Aquisição — Grupo Souza Brasil</title>
<link rel="icon" href="logo.svg">
<script>
  // aplica o tema salvo antes de pintar a tela (evita "flash")
  (function(){try{var t=localStorage.getItem('dash-tema')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0b0a; --bg2:#15100e; --card:#1a1512; --card2:#201813; --line:#2c2420;
    --ink:#f4ede4; --ink-soft:#d8ccc0; --muted:#998e83; --faint:#6b625b;
    --red:#e23b43; --red-deep:#A80C11;
    --quente:#2fbd6b; --morno:#e0a62a; --frio:#8a8178;
    --track:#120d0b; --fstep:#140f0d; --topbar:rgba(20,15,13,.72);
    --bar-grad:linear-gradient(90deg,var(--red-deep),var(--red));
    --kpi-grad:linear-gradient(180deg,var(--card2),var(--card));
    --glow:radial-gradient(1100px 420px at 85% -5%,rgba(168,12,17,.14),transparent 60%);
    --shadow:none; --chip:#1b1512; --chipon:linear-gradient(135deg,var(--red-deep),var(--red));
  }
  :root[data-theme="light"]{
    --bg:#f3eee8; --bg2:#ffffff; --card:#ffffff; --card2:#ffffff; --line:#e7ded4;
    --ink:#1a1614; --ink-soft:#3b332d; --muted:#6f6962; --faint:#a79e95;
    --red:#A80C11; --red-deep:#640101;
    --quente:#1f9d55; --morno:#c98a00; --frio:#8a8178;
    --track:#f0e9e1; --fstep:#faf5f0; --topbar:rgba(255,255,255,.82);
    --bar-grad:linear-gradient(90deg,var(--red-deep),var(--red));
    --kpi-grad:#ffffff;
    --glow:radial-gradient(1100px 420px at 85% -5%,rgba(168,12,17,.06),transparent 60%);
    --shadow:0 1px 2px rgba(80,40,20,.04); --chip:#fff; --chipon:linear-gradient(135deg,var(--red-deep),var(--red));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;background-image:var(--glow)}
  h1,h2,h3,.num{font-family:'Archivo',sans-serif;letter-spacing:-.02em}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  a{color:inherit}

  .topbar{border-bottom:1px solid var(--line);background:var(--topbar);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:13px 22px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{height:44px;width:auto;display:block}
  .brand .t1{font-family:'Archivo';font-weight:800;font-size:16px;line-height:1.1}
  .brand .t2{font-size:12px;color:var(--muted)}
  .top-right{display:flex;align-items:center;gap:12px}
  .badge-demo{font-family:'Archivo';font-weight:700;font-size:10.5px;letter-spacing:.07em;padding:6px 12px;border-radius:20px;
    background:rgba(226,59,67,.12);border:1px solid rgba(226,59,67,.38);color:var(--red)}
  .badge-demo.oficial{background:rgba(47,189,107,.12);border-color:rgba(47,189,107,.4);color:var(--quente)}
  :root[data-theme="light"] .badge-demo{background:rgba(168,12,17,.08);color:var(--red-deep)}
  :root[data-theme="light"] .badge-demo.oficial{background:rgba(31,157,85,.1);color:var(--quente)}
  .updated{font-size:11.5px;color:var(--faint)}
  .btn-top{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:9px;transition:.15s;background:none;cursor:pointer;font-family:'Inter'}
  .btn-top:hover{color:var(--ink);border-color:var(--red)}

  /* barra de controles */
  .controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:20px}
  .seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{border:none;background:none;color:var(--muted);font-family:'Archivo';font-weight:700;font-size:12.5px;padding:8px 15px;border-radius:8px;cursor:pointer;transition:.12s}
  .seg button.on{background:var(--chipon);color:#fff;box-shadow:0 6px 16px rgba(168,12,17,.25)}
  .periodos{display:inline-flex;flex-wrap:wrap;gap:6px}
  .periodos button{border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;transition:.12s;font-family:'Inter'}
  .periodos button:hover{border-color:var(--red);color:var(--ink)}
  .periodos button.on{background:var(--chipon);color:#fff;border-color:transparent}

  main{padding:8px 0 70px}
  .sec-label{font-family:'Archivo';font-weight:800;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:28px 0 13px;display:flex;align-items:center;gap:10px}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

  .aviso{margin:18px 0 2px;padding:14px 17px;border-radius:13px;font-size:13px;line-height:1.5;
    background:rgba(224,166,42,.1);border:1px solid rgba(224,166,42,.35);color:var(--morno)}
  .aviso b{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--kpi-grad);border:1px solid var(--line);border-radius:15px;padding:17px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red-deep),var(--red));opacity:.55}
  .kpi .label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:9px;line-height:1.3}
  .kpi .num{font-size:28px;font-weight:900;color:var(--ink);line-height:1}
  .kpi .sub{font-size:11px;color:var(--faint);margin-top:7px}
  .kpi .sub.up{color:var(--quente);font-weight:600}
  .kpi .sub.down{color:var(--red);font-weight:600}

  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--kpi-grad);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:var(--shadow)}
  .panel h3{font-size:15px;font-weight:800;margin-bottom:2px}
  .panel .psub{font-size:12px;color:var(--muted);margin-bottom:16px}

  .bar-row{display:flex;align-items:center;gap:11px;margin:11px 0}
  .bar-row .name{width:92px;font-size:13px;font-weight:500;color:var(--ink-soft);flex:none}
  .bar-track{flex:1;background:var(--track);border:1px solid var(--line);border-radius:7px;height:24px;overflow:hidden}
  .bar-fill{height:100%;background:var(--bar-grad);border-radius:7px}
  .bar-row .val{width:46px;text-align:right;font-family:'Archivo';font-weight:700;font-size:13px;flex:none}

  .funnel{display:flex;flex-direction:column;gap:9px;margin-top:3px}
  .fstep{background:var(--fstep);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}
  .fstep.dest{border-color:rgba(47,189,107,.5);background:rgba(47,189,107,.08)}
  .fstep .fl{font-size:13px;font-weight:500;color:var(--ink-soft)}
  .fstep .fr{font-family:'Archivo';font-weight:800;font-size:18px}
  .fstep .fp{font-size:11px;color:var(--faint);font-weight:600}

  table{width:100%;border-collapse:collapse;margin-top:2px;font-size:13.5px}
  th{text-align:left;font-family:'Archivo';font-weight:700;font-size:11px;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:12px 10px;border-bottom:1px solid var(--line);color:var(--ink-soft)}
  tr:last-child td{border-bottom:none}
  td b{color:var(--ink);font-weight:600}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;font-family:'Archivo';padding:3px 10px;border-radius:20px;text-transform:capitalize}
  .b-quente{background:rgba(47,189,107,.16);color:var(--quente)}
  .b-morno{background:rgba(224,166,42,.16);color:var(--morno)}
  .b-frio{background:rgba(138,129,120,.18);color:var(--muted)}
  .st{font-size:12.5px;color:var(--muted)}
  .st.pago{color:var(--quente);font-weight:600}
  .vazio{color:var(--faint);font-size:13px;padding:24px 4px;text-align:center}

  /* aprendizado da IA */
  .grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:15px}
  @media(max-width:860px){.grid3{grid-template-columns:1fr}}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{background:var(--fstep);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px}
  .tag .c{font-family:'Archivo';font-weight:800;color:var(--red);font-size:12px}
  .qlist{display:flex;flex-direction:column;gap:9px}
  .qitem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--fstep);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .qitem .qt{font-size:12.8px;color:var(--ink-soft);line-height:1.35}
  .qitem .qn{font-family:'Archivo';font-weight:800;font-size:13px;color:var(--red);flex:none}
  .ia-nota{font-size:11.5px;color:var(--faint);margin-top:12px;font-style:italic}

  .foot{margin-top:30px;padding:17px 19px;background:rgba(226,59,67,.06);border:1px solid rgba(226,59,67,.22);border-radius:13px;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
  .foot b{color:var(--red)}
  :root[data-theme="light"] .foot{background:#fff4e8;border-color:#f0d9bd;color:#8a6a2f}
  :root[data-theme="light"] .foot b{color:#6b4e1e}

  .loading{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
  svg text{font-family:'Inter',sans-serif}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="Grupo Souza Brasil">
      <div>
        <div class="t1">Grupo Souza Brasil</div>
        <div class="t2">Painel de Aquisição · IA SDR (Bia)</div>
      </div>
    </div>
    <div class="top-right">
      <span class="badge-demo" id="demoBadge" style="display:none"></span>
      <span class="updated" id="updated"></span>
      <button class="btn-top" id="btnTema" type="button" title="Alternar tema claro/escuro">🌙 Tema</button>
      <a class="btn-top" href="#" onclick="return false">Sair</a>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="controls">
    <div class="seg" id="segModo">
      <button type="button" data-modo="demo" class="on">Demonstração</button>
      <button type="button" data-modo="real">Oficial</button>
    </div>
    <div class="periodos" id="periodos">
      <button type="button" data-p="hoje">Hoje</button>
      <button type="button" data-p="ontem">Ontem</button>
      <button type="button" data-p="7d">7d</button>
      <button type="button" data-p="14d">14d</button>
      <button type="button" data-p="30d">30d</button>
      <button type="button" data-p="mes" class="on">Mês</button>
      <button type="button" data-p="mespassado">Mês passado</button>
    </div>
  </div>
  <div id="app"><div class="loading">Carregando painel…</div></div>
</main>

function assinatura(d){ const c = {...d}; delete c.atualizado; return JSON.stringify(c); }

function pal(){
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  return {red:g('--red'), line:g('--line'), faint:g('--faint'), ink:g('--ink'), inkSoft:g('--ink-soft')};
}

// Busca os dados (o preview substitui esta função por dados embutidos).
async function obterDados(modo, periodo){
  const r = await fetch('dados.php?modo='+modo+'&periodo='+periodo, {credentials:'same-origin'});
  if(r.status === 401){ location.href = 'login.php'; return null; }
  return await r.json();
}

async function carregar(){
  let d;
  try { d = await obterDados(MODO, PERIODO); }
  catch(e){ document.getElementById('app').innerHTML = '<div class="loading">Não foi possível carregar os dados. Recarregue a página.</div>'; return; }
  if(!d) return;
  DADOS = d; ASSINATURA = assinatura(d); render(d);
}

// Refresh a cada 5 min: busca sempre (pro custo do Meta no futuro) e só repinta se mudou.
async function checarAtualizacao(){
  try{
    const d = await obterDados(MODO, PERIODO);
    if(!d) return;
    const a = assinatura(d);
    DADOS = d;
    if(a !== ASSINATURA){ ASSINATURA = a; render(d); }
  }catch(e){}
}
/* refresh desligado no preview */

function render(d){
  const k = d.kpis;
  const b = document.getElementById('demoBadge');
  if(d.demo){ b.style.display='inline-block'; b.className='badge-demo'; b.textContent='● DADOS DE DEMONSTRAÇÃO'; }
  else { b.style.display='inline-block'; b.className='badge-demo oficial'; b.textContent='● PAINEL OFICIAL'; }
  document.getElementById('updated').textContent = 'Atualizado em ' + d.atualizado;

  const deltaCls = k.delta >= 0 ? 'up' : 'down';
  const deltaTxt = (k.delta >= 0 ? '▲ ' : '▼ ') + Math.abs(k.delta) + '% vs. período anterior';

  const avisoOficialVazio = (!d.demo && d.vazio) ? `
    <div class="aviso"><b>Painel oficial pronto e aguardando a Bia entrar no ar.</b>
    Assim que os primeiros leads reais chegarem, os números aparecem aqui sozinhos —
    sem você mexer em nada. Enquanto isso, veja o botão <b>Demonstração</b> pra visualizar
    como o painel fica cheio.</div>` : '';

  document.getElementById('app').innerHTML = `
    ${avisoOficialVazio}
    <div class="sec-label">Visão — ${d.periodoLabel}</div>
    <div class="kpis">
      <div class="kpi"><div class="label">Leads no período</div><div class="num">${fmt(k.leads)}</div><div class="sub ${deltaCls}">${deltaTxt}</div></div>
      <div class="kpi"><div class="label">Taxa de qualificação</div><div class="num">${k.taxa_qualif}%</div><div class="sub">quentes + mornos</div></div>
      <div class="kpi"><div class="label">Registros fechados</div><div class="num">${fmt(k.registros)}</div><div class="sub">música paga</div></div>
      <div class="kpi"><div class="label">Receita (Camada 1)</div><div class="num">${brl(k.receita)}</div><div class="sub">registros de música</div></div>
      <div class="kpi"><div class="label">Ticket médio</div><div class="num">${brl(k.ticket)}</div><div class="sub">por registro</div></div>
      <div class="kpi"><div class="label">Outros serviços</div><div class="num">${fmt(k.outros)}</div><div class="sub">capturados · Camada 2</div></div>
    </div>

    <div class="sec-label">Fluxo de leads</div>
    <div class="grid2">
      <div class="panel">
        <h3>Leads por dia</h3>
        <div class="psub">A IA atende 24h — inclui madrugada</div>
        <svg id="chartLine" viewBox="0 0 680 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Leads por dia"></svg>
      </div>
      <div class="panel">
        <h3>Funil de conversão</h3>
        <div class="psub">Do lead ao registro fechado</div>
        <div class="funnel" id="funnel"></div>
      </div>
    </div>

    <div class="sec-label">Perfil da demanda</div>
    <div class="grid2">
      <div class="panel">
        <h3>Distribuição por serviço</h3>
        <div class="psub">Confirma a tese: o nicho de música domina</div>
        <div id="bars"></div>
      </div>
      <div class="panel">
        <h3>Classificação dos leads</h3>
        <div class="psub">Como a IA qualificou o período</div>
        <svg id="chartDonut" viewBox="0 0 320 180" width="100%" height="180" role="img" aria-label="Classificação dos leads"></svg>
      </div>
    </div>

    <div class="sec-label">O que a IA está aprendendo</div>
    <div class="grid3" id="aprendizado"></div>

    <div class="sec-label">Últimos atendimentos</div>
    <div class="panel">
      ${d.ultimos.length ? `<table>
        <thead><tr><th>Lead</th><th>Serviço</th><th>Classificação</th><th>Status</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>` : `<div class="vazio">Nenhum atendimento neste período ainda.</div>`}
    </div>

    ${d.demo ? `<div class="foot">
      <b>Dados de demonstração.</b> Números ilustrativos pra mostrar como o painel fica
      cheio. Clique em <b>Oficial</b> pra ver o painel real (que liga sozinho quando a Bia
      começar a atender).
    </div>` : ``}
  `;

  desenharLinha(d.leadsPorDia);
  desenharFunil(d.funil);
  desenharBarras(d.servicos);
  desenharDonut(d.classif);
  if(d.ultimos.length) desenharTabela(d.ultimos);
  desenharAprendizado(d.aprendizado);
}

function desenharLinha(leadsPorDia){
  const p = pal();
  const w=680,h=220,pl=34,pr=14,pt=16,pb=28;
  const max=Math.max(1,...leadsPorDia), n=leadsPorDia.length;
  const x=i=> pl + i*(w-pl-pr)/Math.max(1,(n-1));
  const y=v=> pt + (1-v/max)*(h-pt-pb);
  const pts=leadsPorDia.map((v,i)=>[x(i),y(v)]);
  const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=path+` L ${x(n-1).toFixed(1)} ${h-pb} L ${pl} ${h-pb} Z`;
  let g="";
  const step=Math.max(1,Math.ceil(max/4));
  for(let kk=0;kk<=max;kk+=step){ const yy=y(kk); g+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="${p.line}" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" font-size="10" text-anchor="end" fill="${p.faint}">${kk}</text>`; }
  let lx="";
  for(let i=0;i<n;i+=Math.max(1,Math.round(n/7))){ lx+=`<text x="${x(i)}" y="${h-10}" font-size="10" fill="${p.faint}" text-anchor="middle">${n-1-i===0?'hoje':(n-1-i)+'d'}</text>`; }
  const dots=pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="${p.red}"/>`).join("");
  document.getElementById('chartLine').innerHTML =
    g + `<path d="${area}" fill="${p.red}" fill-opacity="0.10"/>` +
    `<path d="${path}" fill="none" stroke="${p.red}" stroke-width="2.5" stroke-linejoin="round"/>` + dots + lx;
}

function desenharFunil(funil){
  document.getElementById('funnel').innerHTML = funil.map(f=>`
    <div class="fstep${f.destaque?' dest':''}">
      <span class="fl">${f.label}</span>
      <span><span class="fr" ${f.destaque?'style="color:var(--quente)"':''}>${fmt(f.val)}</span> <span class="fp">${f.pct}%</span></span>
    </div>`).join("");
}

function desenharBarras(servicos){
  document.getElementById('bars').innerHTML = servicos.map(s=>`
    <div class="bar-row">
      <div class="name">${s.nome}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.val}%"></div></div>
      <div class="val">${s.val}%</div>
    </div>`).join("");
}

function desenharDonut(classif){
  const p = pal();
  const cx=90,cy=90,r=62,sw=26, tot=classif.reduce((a,b)=>a+b.val,0)||1;
  let ang=-Math.PI/2, segs="";
  classif.forEach(c=>{
    const frac=c.val/tot; if(frac<=0){return;}
    const a2=ang+ frac*2*Math.PI;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const large=(a2-ang)>Math.PI?1:0;
    segs+=`<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${c.cor}" stroke-width="${sw}" stroke-linecap="butt"/>`;
    ang=a2;
  });
  const leg=classif.map((c,i)=>`<g transform="translate(200,${48+i*34})"><rect width="13" height="13" rx="3" fill="${c.cor}"/><text x="20" y="11" font-size="13" fill="${p.inkSoft}">${c.nome}</text><text x="118" y="11" font-size="13" font-weight="700" fill="${p.ink}" text-anchor="end" font-family="Archivo">${c.val}%</text></g>`).join("");
  document.getElementById('chartDonut').innerHTML = segs + leg;
}

function desenharTabela(ultimos){
  document.getElementById('tbody').innerHTML = ultimos.map(u=>`
    <tr>
      <td><b>${u.nome}</b></td>
      <td>${u.serv}</td>
      <td><span class="badge b-${u.temp}">${u.temp}</span></td>
      <td class="st ${u.pago?'pago':''}">${u.st}</td>
    </tr>`).join("");
}

function desenharAprendizado(a){
  const box = document.getElementById('aprendizado');
  if(!a || a.vazio){
    box.innerHTML = `<div class="panel" style="grid-column:1/-1"><div class="vazio">
      Assim que a Bia começar a conversar, aqui aparecem os <b>termos mais falados</b>,
      as <b>dúvidas</b> e as <b>objeções</b> mais comuns dos leads — a inteligência da operação
      (tecnologia Anthropic) aprendendo com cada conversa.</div></div>`;
    return;
  }
  const termos = a.termos.map(t=>`<span class="tag">${t.t} <span class="c">${t.n}</span></span>`).join("");
  const duvidas = a.duvidas.map(q=>`<div class="qitem"><span class="qt">${q.t}</span><span class="qn">${q.n}</span></div>`).join("");
  const obj = a.objecoes.map(q=>`<div class="qitem"><span class="qt">${q.t}</span><span class="qn">${q.n}</span></div>`).join("");
  box.innerHTML = `
    <div class="panel"><h3>Termos mais falados</h3><div class="psub">O que os leads mais citam</div>
      <div class="tags">${termos}</div>
      <div class="ia-nota">Mina das conversas da Bia — vira munição pra anúncios e script.</div></div>
    <div class="panel"><h3>Dúvidas mais frequentes</h3><div class="psub">O que mais perguntam</div>
      <div class="qlist">${duvidas}</div></div>
    <div class="panel"><h3>Objeções mais comuns</h3><div class="psub">Onde a venda trava</div>
      <div class="qlist">${obj}</div></div>`;
}

/* ===== tema ===== */
function aplicarBotaoTema(){
  const t = document.documentElement.getAttribute('data-theme');
  const b = document.getElementById('btnTema');
  if(b) b.textContent = (t === 'light') ? '🌙 Escuro' : '☀️ Claro';
}
document.getElementById('btnTema').addEventListener('click', function(){
  const atual = document.documentElement.getAttribute('data-theme');
  const novo = (atual === 'light') ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', novo);
  try{ localStorage.setItem('dash-tema', novo); }catch(e){}
  aplicarBotaoTema();
  if(DADOS) render(DADOS);
});

/* ===== controles: modo e período ===== */
document.getElementById('segModo').addEventListener('click', function(e){
  const btn = e.target.closest('button'); if(!btn) return;
  MODO = btn.dataset.modo;
  [...this.children].forEach(c=>c.classList.toggle('on', c===btn));
  carregar();
});
document.getElementById('periodos').addEventListener('click', function(e){
  const btn = e.target.closest('button'); if(!btn) return;
  PERIODO = btn.dataset.p;
  [...this.children].forEach(c=>c.classList.toggle('on', c===btn));
  carregar();
});

obterDados = async function(m,p){ const M = window.PREVIEW_DATASETS[m] || window.PREVIEW_DATASETS.demo; return M[p] || M.mes; };
aplicarBotaoTema();
carregar();
